name: Feature request
description: Make working in VR more comfortable.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe a concrete task and where the current experience gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: Include any workaround you use today.
    validations:
      required: true
