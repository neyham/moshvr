// Read-only dependency resolution inventory. No Gradle property values are exported.
allprojects { p ->
    if (p.path == ':app') {
        p.tasks.register('writeReleaseInventory') {
            doLast {
                def entries = []
                p.configurations.releaseRuntimeClasspath.incoming.resolutionResult.allComponents.each { c ->
                    if (c.id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) {
                        def id = c.id
                        def cached = new File(gradle.gradleUserHomeDir, "caches/modules-2/files-2.1/${id.group}/${id.module}/${id.version}")
                        def files = p.fileTree(cached).matching { include '**/*.aar', '**/*.jar', '**/*.pom'; exclude '**/*-sources.jar', '**/*-javadoc.jar' }.files
                        files.sort().each { f ->
                            entries << [coordinate: "${id.group}:${id.module}:${id.version}", file: f.absolutePath,
                                sha256: java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString()]
                        }
                    }
                }
                entries.sort { it.coordinate + it.file }
                def out = new File(p.rootDir, 'build/reports/release-inventory/release-dependencies.json')
                out.parentFile.mkdirs()
                out.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(entries)) + '\n'
                println "Wrote ${entries.size()} resolved release artifacts"
            }
        }
    }
}
